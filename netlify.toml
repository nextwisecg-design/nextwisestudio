# nextwise.studio: site static (română la /, engleză la /en/). Nu are build, funcții sau edge functions.
# Site-ul vechi (variante pe piețe, diagnosticul AI, audituri) e păstrat în legacy/ și nu se mai publică.
[build]
  publish = "site"
  command = "echo 'site static, fără build'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Adresele site-ului vechi duc la pagina nouă, în limba potrivită
[[redirects]]
  from = "/ro/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/global/*"
  to = "/en/"
  status = 301

[[redirects]]
  from = "/us/*"
  to = "/en/"
  status = 301

[[redirects]]
  from = "/uae/*"
  to = "/en/"
  status = 301

[[redirects]]
  from = "/audit/*"
  to = "/"
  status = 302

# Orice altă adresă necunoscută arată prima pagină
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
